<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nephthys Blog — 수학, 과학, 코드에 관한 기록" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- CITYRUIN 모노는 Chivo Mono(SIL OFL — 0 안에 점·선 없는 plain zero 실측 확인), TOKYOSKY 모노는 IBM Plex Mono(SIL OFL) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- TOKYOSKY 테마 폰트 (전부 SIL OFL) — Outfit(라틴) + IBM Plex Sans KR/JP(한·일) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- 첫 페인트 전에 저장된 테마를 적용 (FOUC 방지) — 기본은 tokyosky -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('nephthys-theme') === 'cityruin' ? 'cityruin' : 'tokyosky'
    </script>
    <title>Nephthys Blog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
